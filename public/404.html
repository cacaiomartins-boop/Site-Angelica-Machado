<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página não encontrada | Angélica Thiengo Machado</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#386e56" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:#386e56;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
  main{max-width:460px}
  .logo{width:72px;height:72px;margin:0 auto 24px;border-radius:50%;background:#fff;padding:3px;display:flex}
  .logo img{width:100%;height:100%;object-fit:contain}
  .code{font:400 14px/1 Georgia,"EB Garamond",serif;letter-spacing:.18em;text-transform:uppercase;color:#f0d9b5}
  h1{margin-top:14px;font:400 34px/1.2 Georgia,"EB Garamond",serif;text-wrap:balance}
  p{margin-top:14px;font-size:15px;line-height:1.7;color:rgba(255,255,255,.92);text-wrap:balance}
  .actions{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 26px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;transition:transform .3s ease,background-color .3s ease}
  .primary{background:#cf8252;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2)}
  .primary:hover{background:#bd7244;transform:translateY(-2px)}
  .ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .ghost:hover{background:rgba(255,255,255,.22)}
  a:focus-visible{outline:3px solid #f0d9b5;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
  <span class="logo"><img src="/img/logo.webp" alt="" width="96" height="96" /></span>
  <p class="code">Erro 404</p>
  <h1>Esta página não foi encontrada</h1>
  <p>O endereço pode ter mudado ou não existir. Você pode voltar ao início ou conhecer a formação da Angélica.</p>
  <div class="actions">
    <a class="primary" href="/">Voltar ao início</a>
    <a class="ghost" href="/formacao">Conhecer a formação</a>
  </div>
</main>
</body>
</html>
